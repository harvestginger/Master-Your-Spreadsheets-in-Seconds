<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormulaFlow - Master Your Spreadsheets in Seconds</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #09090b;
            color: #ffffff;
        }

        .glassmorphism {
            background: rgba(18, 18, 24, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(113, 113, 122, 0.2);
        }

        .card-dark {
            background: #18181b;
            border: 1px solid rgba(113, 113, 122, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #27272a;
            color: #ffffff;
            border: 1px solid rgba(113, 113, 122, 0.3);
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #3f3f46;
            border-color: rgba(99, 102, 241, 0.5);
        }

        .text-accent {
            color: #a1a1aa;
        }

        textarea {
            background: #27272a;
            color: #ffffff;
            border: 1px solid rgba(113, 113, 122, 0.3);
            padding: 16px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: all 0.3s ease;
            width: 100%;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .formula-box {
            background: #27272a;
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 16px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            color: #6366f1;
        }

        .dropdown {
            background: #27272a;
            color: #ffffff;
            border: 1px solid rgba(113, 113, 122, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .dropdown:hover {
            border-color: rgba(99, 102, 241, 0.5);
        }

        .feature-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: #a78bfa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 80px;
        }

        .bento-card {
            background: #18181b;
            border: 1px solid rgba(113, 113, 122, 0.2);
            padding: 28px;
            border-radius: 12px;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bento-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.1);
            transform: translateY(-8px);
        }

        .copy-button {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid rgba(113, 113, 122, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .copy-button:hover {
            background: #3f3f46;
            color: #ffffff;
            border-color: rgba(99, 102, 241, 0.5);
        }

        .copy-button.copied {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border-color: #22c55e;
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }

            .btn-primary {
                padding: 10px 24px;
                font-size: 14px;
            }

            h1 {
                font-size: 28px !important;
            }

            h2 {
                font-size: 22px !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function FormulaFlow() {
            const [formulaInput, setFormulaInput] = useState('');
            const [generatedFormula, setGeneratedFormula] = useState('');
            const [sheetType, setSheetType] = useState('Excel');
            const [copied, setCopied] = useState(false);
            const toolsRef = useRef(null);

            const generateFormula = () => {
                if (!formulaInput.trim()) {
                    setGeneratedFormula('');
                    return;
                }

                const input = formulaInput.toLowerCase();
                let formula = '';

                if (input.includes('average') && input.includes('where')) {
                    formula = '=AVERAGEIFS(average_range, criteria_range1, criteria1, criteria_range2, criteria2)';
                } else if (input.includes('sum') && input.includes('where')) {
                    formula = '=SUMIFS(sum_range, criteria_range1, criteria1, criteria_range2, criteria2)';
                } else if (input.includes('count') && input.includes('where')) {
                    formula = '=COUNTIFS(criteria_range1, criteria1, criteria_range2, criteria2)';
                } else if (input.includes('average') || input.includes('mean')) {
                    formula = '=AVERAGE(range)';
                } else if (input.includes('sum') || input.includes('total')) {
                    formula = '=SUM(range)';
                } else if (input.includes('count')) {
                    formula = '=COUNT(range)';
                } else if (input.includes('max') || input.includes('maximum')) {
                    formula = '=MAX(range)';
                } else if (input.includes('min') || input.includes('minimum')) {
                    formula = '=MIN(range)';
                } else if (input.includes('if')) {
                    formula = '=IF(condition, value_if_true, value_if_false)';
                } else if (input.includes('vlookup') || input.includes('lookup')) {
                    formula = '=VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])';
                } else if (input.includes('percentage') || input.includes('percent')) {
                    formula = '=(value/total)*100';
                } else if (input.includes('concatenate') || input.includes('combine')) {
                    formula = '=CONCATENATE(text1, text2, text3)';
                } else {
                    formula = '=QUERY(range, "SELECT * WHERE column > 100")';
                }

                if (sheetType === 'Google Sheets') {
                    if (formula.includes('VLOOKUP')) {
                        formula = '=ARRAYFORMULA(IF(row(A:A)=1, "Header", VLOOKUP(A2:A, data_range, 2, FALSE)))';
                    }
                }

                setGeneratedFormula(formula);
                setCopied(false);
            };

            const copyFormula = () => {
                navigator.clipboard.writeText(generatedFormula);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const downloadTemplate = (fileName, content) => {
                const element = document.createElement('a');
                const file = new Blob([content], { type: 'text/csv' });
                element.href = URL.createObjectURL(file);
                element.download = fileName;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            const handleDownloadPL = () => {
                const csv = `Date,Category,Amount,Notes\n2024-01-01,Revenue,50000,Q1 Sales\n2024-01-01,Expenses,15000,Operating Costs\n2024-02-01,Revenue,52000,Q1 Sales\n2024-02-01,Expenses,16000,Operating Costs\n2024-03-01,Revenue,55000,Q1 Sales\n2024-03-01,Expenses,17000,Operating Costs`;
                downloadTemplate('Annual_Profit_Loss.csv', csv);
            };

            const handleDownloadCashFlow = () => {
                const csv = `Month,Beginning Balance,Cash Inflows,Cash Outflows,Ending Balance\nJanuary,10000,25000,15000,20000\nFebruary,20000,28000,18000,30000\nMarch,30000,30000,20000,40000\nApril,40000,32000,22000,50000`;
                downloadTemplate('Startup_Cash_Flow.csv', csv);
            };

            const handleDownloadBudget = () => {
                const csv = `Category,Budgeted,Actual,Variance\nSalaries,45000,44500,500\nRent,8000,8000,0\nMarketing,12000,11800,200\nOperations,10000,10200,-200\nMisc,5000,4800,200`;
                downloadTemplate('Monthly_Budget_Tracker.csv', csv);
            };

            const handleDownloadPitch = () => {
                const csv = `Slide,Title,Description\n1,Cover,Company Name & Logo\n2,Problem Statement,Market Pain Point\n3,Solution,Product Overview\n4,Market Size,TAM Analysis\n5,Business Model,Revenue Streams\n6,Team,Key Executives\n7,Financials,Projections\n8,Call to Action,Investment Ask`;
                downloadTemplate('Pitch_Deck_Master.csv', csv);
            };

            const handleDownloadQBR = () => {
                const csv = `Section,Q3 2024,Q4 2024,YoY Growth\nRevenue,500000,550000,15%\nCost of Goods,200000,220000,10%\nGross Profit,300000,330000,20%\nOperating Expenses,150000,160000,8%\nNet Income,150000,170000,25%`;
                downloadTemplate('Quarterly_Business_Review.csv', csv);
            };

            const scrollToTools = () => {
                toolsRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div style={{ backgroundColor: '#09090b' }}>
                    <nav className="sticky-nav glassmorphism">
                        <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '16px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ fontSize: '20px', fontWeight: '700', background: 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                                FormulaFlow
                            </div>
                            <div style={{ display: 'flex', gap: '32px', alignItems: 'center' }}>
                                <button onClick={scrollToTools} style={{ background: 'none', border: 'none', color: '#a1a1aa', cursor: 'pointer', fontSize: '14px', transition: 'color 0.3s ease' }} onMouseEnter={(e) => e.target.style.color = '#ffffff'} onMouseLeave={(e) => e.target.style.color = '#a1a1aa'}>
                                    Formula Gen
                                </button>
                                <button onClick={scrollToTools} style={{ background: 'none', border: 'none', color: '#a1a1aa', cursor: 'pointer', fontSize: '14px', transition: 'color 0.3s ease' }} onMouseEnter={(e) => e.target.style.color = '#ffffff'} onMouseLeave={(e) => e.target.style.color = '#a1a1aa'}>
                                    Finance Templates
                                </button>
                                <button onClick={scrollToTools} style={{ background: 'none', border: 'none', color: '#a1a1aa', cursor: 'pointer', fontSize: '14px', transition: 'color 0.3s ease' }} onMouseEnter={(e) => e.target.style.color = '#ffffff'} onMouseLeave={(e) => e.target.style.color = '#a1a1aa'}>
                                    Slide Templates
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '120px 24px', textAlign: 'center' }}>
                        <h1 style={{ fontSize: '52px', fontWeight: '800', marginBottom: '24px', background: 'linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                            Master Your Spreadsheets in Seconds
                        </h1>
                        <p style={{ fontSize: '18px', color: '#a1a1aa', marginBottom: '32px', maxWidth: '600px', margin: '0 auto 32px' }}>
                            Transform natural language into powerful formulas. Create professional financial templates. Supercharge your presentation workflow. All in one platform.
                        </p>
                        <button className="btn-primary" onClick={scrollToTools} style={{ fontSize: '16px', padding: '14px 32px' }}>
                            Get Started Now
                        </button>
                    </div>

                    <div ref={toolsRef} style={{ maxWidth: '1200px', margin: '0 auto', padding: '60px 24px' }}>
                        <h2 style={{ fontSize: '36px', fontWeight: '700', marginBottom: '48px', textAlign: 'center', background: 'linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                            Formula Generator
                        </h2>

                        <div style={{ maxWidth: '800px', margin: '0 auto', background: '#18181b', padding: '40px', borderRadius: '12px', border: '1px solid rgba(113, 113, 122, 0.2)' }}>
                            <div style={{ marginBottom: '24px' }}>
                                <label style={{ display: 'block', marginBottom: '8px', fontSize: '14px', fontWeight: '600', color: '#ffffff' }}>
                                    Sheet Type
                                </label>
                                <select className="dropdown" value={sheetType} onChange={(e) => setSheetType(e.target.value)}>
                                    <option>Excel</option>
                                    <option>Google Sheets</option>
                                </select>
                            </div>

                            <div style={{ marginBottom: '24px' }}>
                                <label style={{ display: 'block', marginBottom: '8px', fontSize: '14px', fontWeight: '600', color: '#ffffff' }}>
                                    Describe Your Formula
                                </label>
                                <textarea
                                    value={formulaInput}
                                    onChange={(e) => setFormulaInput(e.target.value)}
                                    placeholder="e.g., Find the average sale where the region is West and profit is above 500"
                                    rows="6"
                                />
                            </div>

                            <button className="btn-primary" onClick={generateFormula} style={{ width: '100%', marginBottom: '32px' }}>
                                Generate Formula
                            </button>

                            {generatedFormula && (
                                <div>
                                    <label style={{ display: 'block', marginBottom: '8px', fontSize: '14px', fontWeight: '600', color: '#ffffff' }}>
                                        Generated Formula
                                    </label>
                                    <div className="formula-box" style={{ marginBottom: '16px', minHeight: '60px', display: 'flex', alignItems: 'center' }}>
                                        {generatedFormula}
                                    </div>
                                    <button
                                        className={`copy-button ${copied ? 'copied' : ''}`}
                                        onClick={copyFormula}
                                    >
                                        {copied ? '✓ Copied to Clipboard' : 'Copy Formula'}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '60px 24px' }}>
                        <h2 style={{ fontSize: '36px', fontWeight: '700', marginBottom: '48px', textAlign: 'center', background: 'linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                            Financial Reports Templates
                        </h2>

                        <div className="bento-grid">
                            <div className="bento-card">
                                <div>
                                    <h3 style={{ fontSize: '20px', fontWeight: '700', marginBottom: '12px', color: '#ffffff' }}>
                                        Annual Profit & Loss Statement
                                    </h3>
                                    <p style={{ color: '#a1a1aa', marginBottom: '16px', fontSize: '14px', lineHeight: '1.6' }}>
                                        Comprehensive annual P&L with revenue breakdown, cost analysis, and net income calculations.
                                    </p>
                                    <div style={{ marginBottom: '20px' }}>
                                        <span className="feature-tag">Revenue Tracking</span>
                                        <span className="feature-tag">Cost Analysis</span>
                                        <span className="feature-tag">Net Income</span>
                                        <span className="feature-tag">YoY Comparison</span>
                                    </div>
                                </div>
                                <button className="btn-primary" onClick={handleDownloadPL} style={{ width: '100%' }}>
                                    Download .xlsx
                                </button>
                            </div>

                            <div className="bento-card">
                                <div>
                                    <h3 style={{ fontSize: '20px', fontWeight: '700', marginBottom: '12px', color: '#ffffff' }}>
                                        Startup Cash Flow Forecast
                                    </h3>
                                    <p style={{ color: '#a1a1aa', marginBottom: '16px', fontSize: '14px', lineHeight: '1.6' }}>
                                        Project your cash position with monthly inflows, outflows, and balance forecasting.
                                    </p>
                                    <div style={{ marginBottom: '20px' }}>
                                        <span className="feature-tag">Monthly Projections</span>
                                        <span className="feature-tag">Cash Inflows</span>
                                        <span className="feature-tag">Cash Outflows</span>
                                        <span className="feature-tag">Balance Tracking</span>
                                    </div>
                                </div>
                                <button className="btn-primary" onClick={handleDownloadCashFlow} style={{ width: '100%' }}>
                                    Download .xlsx
                                </button>
                            </div>

                            <div className="bento-card">
                                <div>
                                    <h3 style={{ fontSize: '20px', fontWeight: '700', marginBottom: '12px', color: '#ffffff' }}>
                                        Monthly Budget Tracker
                                    </h3>
                                    <p style={{ color: '#a1a1aa', marginBottom: '16px', fontSize: '14px', lineHeight: '1.6' }}>
                                        Track monthly expenses against budget with variance analysis and spending insights.
                                    </p>
                                    <div style={{ marginBottom: '20px' }}>
                                        <span className="feature-tag">Budget Tracking</span>
                                        <span className="feature-tag">Variance Analysis</span>
                                        <span className="feature-tag">Category Breakdown</span>
                                        <span className="feature-tag">Spend Insights</span>
                                    </div>
                                </div>
                                <button className="btn-primary" onClick={handleDownloadBudget} style={{ width: '100%' }}>
                                    Download .xlsx
                                </button>
                            </div>
                        </div>
                    </div>

                    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '60px 24px' }}>
                        <h2 style={{ fontSize: '36px', fontWeight: '700', marginBottom: '48px', textAlign: 'center', background: 'linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                            Presentation Templates
                        </h2>

                        <div className="bento-grid">
                            <div className="bento-card">
                                <div>
                                    <h3 style={{ fontSize: '20px', fontWeight: '700', marginBottom: '12px', color: '#ffffff' }}>
                                        Pitch Deck Master Template
                                    </h3>
                                    <p style={{ color: '#a1a1aa', marginBottom: '16px', fontSize: '14px', lineHeight: '1.6' }}>
                                        Professional investor pitch deck with slides for problem, solution, market, team, and financials.
                                    </p>
                                    <div style={{ marginBottom: '20px' }}>
                                        <span className="feature-tag">8 Slides</span>
                                        <span className="feature-tag">16:9 Aspect Ratio</span>
                                        <span className="feature-tag">Investor Ready</span>
                                        <span className="feature-tag">Fully Customizable</span>
                                    </div>
                                </div>
                                <button className="btn-primary" onClick={handleDownloadPitch} style={{ width: '100%' }}>
                                    Download .pptx
                                </button>
                            </div>

                            <div className="bento-card">
                                <div>
                                    <h3 style={{ fontSize: '20px', fontWeight: '700', marginBottom: '12px', color: '#ffffff' }}>
                                        Quarterly Business Review
                                    </h3>
                                    <p style={{ color: '#a1a1aa', marginBottom: '16px', fontSize: '14px', lineHeight: '1.6' }}>
                                        Executive presentation for quarterly performance review with KPIs and strategic outlook.
                                    </p>
                                    <div style={{ marginBottom: '20px' }}>
                                        <span className="feature-tag">12 Slides</span>
                                        <span className="feature-tag">16:9 Aspect Ratio</span>
                                        <span className="feature-tag">KPI Focused</span>
                                        <span className="feature-tag">Data Charts Included</span>
                                    </div>
                                </div>
                                <button className="btn-primary" onClick={handleDownloadQBR} style={{ width: '100%' }}>
                                    Download .pptx
                                </button>
                            </div>
                        </div>
                    </div>

                    <footer style={{ borderTop: '1px solid rgba(113, 113, 122, 0.2)', marginTop: '80px', padding: '40px 24px', textAlign: 'center' }}>
                        <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
                            <p style={{ color: '#a1a1aa', fontSize: '14px', marginBottom: '16px' }}>
                                © 2024 FormulaFlow. All rights reserved.
                            </p>
                            <div style={{ display: 'flex', gap: '24px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                <a href="#" style={{ color: '#a1a1aa', textDecoration: 'none', fontSize: '13px', transition: 'color 0.3s ease' }} onMouseEnter={(e) => e.target.style.color = '#ffffff'} onMouseLeave={(e) => e.target.style.color = '#a1a1aa'}>
                                    Privacy Policy
                                </a>
                                <a href="#" style={{ color: '#a1a1aa', textDecoration: 'none', fontSize: '13px', transition: 'color 0.3s ease' }} onMouseEnter={(e) => e.target.style.color = '#ffffff'} onMouseLeave={(e) => e.target.style.color = '#a1a1aa'}>
                                    Terms of Service
                                </a>
                                <a href="#" style={{ color: '#a1a1aa', textDecoration: 'none', fontSize: '13px', transition: 'color 0.3s ease' }} onMouseEnter={(e) => e.target.style.color = '#ffffff'} onMouseLeave={(e) => e.target.style.color = '#a1a1aa'}>
                                    Contact Us
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<FormulaFlow />, document.getElementById('root'));
    </script>
</body>
</html>
